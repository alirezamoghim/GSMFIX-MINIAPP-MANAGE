<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSMFIX Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #090e1a;
            color: #f8fafc;
            padding-top: 60px;
            padding-bottom: 80px;
        }

        /* هدر مینیمال بالا */
        .miniapp-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 18px;
            font-weight: 800;
            color: #06b6d4;
            letter-spacing: 0.5px;
        }

        .header-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* محتوای اصلی */
        .container {
            padding: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        /* کارت دستگاه */
        .device-card {
            background: #131c31;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .device-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .device-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        /* برچسب وضعیت */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-repairing {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .device-meta {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .device-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }

        .btn-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
        }

        .btn-card.primary {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* نوار ناوبری پایین (Bottom Nav) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active {
            color: #06b6d4;
        }
    </style>
</head>
<body>

    <!-- هدر بالای صفحه -->
    <header class="miniapp-header">
        <div class="brand-logo">GSM FIX</div>
        <div class="header-action">جستجو</div>
    </header>

    <!-- محتوا -->
    <main class="container">
        <div class="section-title">دستگاه‌های پذیرش‌شده</div>

        <!-- نمونه کارت دستگاه -->
        <div class="device-card">
            <div class="device-card-header">
                <span class="device-title">Samsung A12 <span style="font-size: 12px; color: #64748b;">(Blue - 128G)</span></span>
                <span class="badge badge-repairing">در حال تعمیر</span>
            </div>
            <div class="device-meta">
                <div>مشتری: محمد خلفی - 09050236953</div>
                <div>کد پیگیری: HW-4773177</div>
                <div>تعمیرکار: سعید</div>
            </div>
            <div class="device-actions">
                <button class="btn-card">جزئیات</button>
                <button class="btn-card primary">قبض</button>
            </div>
        </div>

    </main>

    <!-- نوار پایین صفحه -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">داشبورد</a>
        <a href="#" class="nav-item">ثبت سفارش</a>
        <a href="#" class="nav-item active">پذیرش‌شده</a>
        <a href="#" class="nav-item">مدیریت</a>
    </nav>

</body>
</html>
